name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src-tauri/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Write release keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/src-tauri/gen/android/app/kinetix-release.jks

      - name: Write key.properties from secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > frontend/src-tauri/gen/android/app/key.properties <<EOF
          storeFile=kinetix-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build signed release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cd frontend
          npx tauri android build --apk

      - name: Locate built APK
        id: apk
        run: |
          apk_path=$(find frontend/src-tauri/gen/android/app/build/outputs/apk -iname "*-release.apk" ! -iname "*unsigned*" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "ERROR: no signed release APK found"
            find frontend/src-tauri/gen/android/app/build/outputs/apk -type f
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "Found signed APK: $apk_path"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinetix-android-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Clean up signing material
        if: always()
        run: |
          rm -f frontend/src-tauri/gen/android/app/kinetix-release.jks
          rm -f frontend/src-tauri/gen/android/app/key.properties
