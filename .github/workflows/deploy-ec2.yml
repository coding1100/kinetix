name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'backend-py/**'
              - 'frontend/**'
              - 'deploy/**'
              - 'docker-compose.yml'
              - 'docker-compose.app.yml'
              - '.github/workflows/deploy-ec2.yml'
            admin:
              - 'admin-frontend/**'

  deploy-app:
    name: Deploy production app
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_ROOT: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_ROOT
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export APP_ROOT="${APP_ROOT:-/opt/clickup/kinetix}"
            cd "$APP_ROOT"
            # Reset before deploy.sh so local edits on the server cannot block CI
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/deploy.sh deploy/setup-services.sh deploy/fix-frontend-prod.sh 2>/dev/null || true
            ./deploy/deploy.sh

      - name: Summary
        if: success()
        run: echo "Deployed app (api/web) to production EC2"

  deploy-admin:
    name: Deploy admin portal
    # needs (not just a path condition) so this always runs after deploy-app
    # finishes - app takes priority - but always() means a failed or skipped
    # deploy-app never blocks or fails this job; the two are independent.
    needs: [changes, deploy-app]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_ROOT: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_ROOT
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            export APP_ROOT="${APP_ROOT:-/opt/clickup/kinetix}"
            cd "$APP_ROOT"
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/deploy-admin.sh 2>/dev/null || true
            ./deploy/deploy-admin.sh

      - name: Summary
        if: success()
        run: echo "Deployed admin portal to production EC2"
