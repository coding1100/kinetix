name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'backend-py/**'
              - 'frontend/**'
              - 'deploy/**'
              - 'docker-compose.yml'
              - 'docker-compose.app.yml'
              - '.github/**'
            admin:
              - 'admin-frontend/**'

  deploy-app:
    name: Deploy production app
    needs: [changes, validate-api]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_ROOT: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_ROOT
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export APP_ROOT="${APP_ROOT:-/opt/clickup/kinetix}"
            cd "$APP_ROOT"
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/deploy.sh deploy/setup-services.sh deploy/fix-frontend-prod.sh 2>/dev/null || true
            ./deploy/deploy.sh

      - name: Summary
        if: success()
        run: echo "Deployed app (api/web) to production EC2"

  validate-api:
    name: Validate API migrations
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kinetix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kinetix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend-py
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kinetix_ci
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kinetix_ci
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-outside-this-ephemeral-job
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-outside-this-ephemeral-job
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install API dependencies
        run: uv sync --frozen --no-dev
      - name: Create current schema
        run: |
          uv run python - <<'PY'
          import asyncio
          from app.db import models  # noqa: F401
          from app.db.base import Base
          from app.db.session import get_engine

          async def create_schema():
              engine = get_engine()
              async with engine.begin() as connection:
                  await connection.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(create_schema())
          PY
      - name: Apply migration manifest twice
        run: |
          uv run python scripts/apply_migrations.py
          uv run python scripts/apply_migrations.py

  deploy-admin:
    name: Deploy admin portal
    needs: [changes, deploy-app]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_ROOT: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_ROOT
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            export APP_ROOT="${APP_ROOT:-/opt/clickup/kinetix}"
            cd "$APP_ROOT"
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/deploy-admin.sh 2>/dev/null || true
            ./deploy/deploy-admin.sh

      - name: Summary
        if: success()
        run: echo "Deployed admin portal to production EC2"
