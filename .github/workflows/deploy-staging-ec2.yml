name: Deploy Staging to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2-staging
  cancel-in-progress: false

jobs:
  backend-ci:
    name: Validate Staging Backend (FastAPI & Pytest)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: kinetix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend-py/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend-py
          uv sync --extra dev

      - name: Bootstrap & Seed Database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/kinetix_test
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/kinetix_test
          JWT_SECRET: testsecretkey12345678901234567890
          API_PUBLIC_URL: http://localhost:4001
        run: |
          cd backend-py
          uv run python scripts/bootstrap_local_db.py
          uv run python scripts/seed_demo_admin.py

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/kinetix_test
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/kinetix_test
          JWT_SECRET: testsecretkey12345678901234567890
          API_PUBLIC_URL: http://localhost:4001
          FRONTEND_URL: http://localhost:3001
        run: |
          cd backend-py
          uv run pytest

  frontend-ci:
    name: Validate Staging Frontend (Next.js & Vitest)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm run test

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: /staging/api/v1
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy staging
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_ROOT: ${{ secrets.EC2_STAGING_APP_PATH }}
          DEPLOY_BRANCH: develop
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_ROOT,DEPLOY_BRANCH,DEPLOY_SHA
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export APP_ROOT="${APP_ROOT:-/opt/clickup/kinetix-staging}"
            export PROD_ROOT="${PROD_ROOT:-/opt/clickup/kinetix}"
            export DEPLOY_BRANCH="${DEPLOY_BRANCH:-develop}"
            export PUBLIC_HOST="kinetix.mindrind.com"
            export STAGING_PUBLIC_URL="https://kinetix.mindrind.com/staging"
            export STAGING_FRONTEND_ORIGIN="https://kinetix.mindrind.com"
            cd "$APP_ROOT"
            git fetch --no-tags origin "$DEPLOY_BRANCH"
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            chmod +x deploy/deploy-staging.sh deploy/setup-staging-services.sh deploy/ec2-restore.sh 2>/dev/null || true
            ./deploy/deploy-staging.sh

      - name: Summary
        if: success()
        run: echo "Deployed develop branch to staging EC2"
