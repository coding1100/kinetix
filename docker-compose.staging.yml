# Staging stack — Docker only. Public URL: http://HOST/staging via host nginx
# (see deploy/nginx/host.conf) — api/web publish to 127.0.0.1 so host nginx
# can proxy_pass to them directly, no shared Docker network needed for routing.
#
# Deploy:
#   ./deploy/reset-staging-docker.sh
#   docker compose -f docker-compose.staging.yml up -d --build

name: kinetix-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - docker-compose.env
    volumes:
      - riseup_pg_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./backend-py
    image: kinetix-staging-api
    restart: unless-stopped
    env_file:
      - docker-compose.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-staging-jwt-access-secret-min-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-staging-jwt-refresh-secret-min-32-chars-long}
      API_PUBLIC_URL: ${STAGING_PUBLIC_URL:-https://kinetix.mindrind.com/staging}
      FRONTEND_URL: ${STAGING_FRONTEND_ORIGIN:-https://kinetix.mindrind.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:4010:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BASE_PATH: /staging
        NEXT_PUBLIC_API_URL: /staging/api/v1
        NEXT_PUBLIC_APP_URL: ${STAGING_PUBLIC_URL:-https://kinetix.mindrind.com/staging}
        NEXT_PUBLIC_SOCKET_URL: ${STAGING_PUBLIC_URL:-https://kinetix.mindrind.com/staging}
    image: kinetix-staging-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_BASE_PATH: /staging
      NEXT_PUBLIC_API_URL: /staging/api/v1
      NEXT_PUBLIC_APP_URL: ${STAGING_PUBLIC_URL:-https://kinetix.mindrind.com/staging}
      NEXT_PUBLIC_SOCKET_URL: ${STAGING_PUBLIC_URL:-https://kinetix.mindrind.com/staging}
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  riseup_pg_data_staging:
