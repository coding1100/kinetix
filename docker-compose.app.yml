# Production app stack — use with:
#   cp docker-compose.env.example docker-compose.env   # set secrets on server only
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d

services:
  postgres:
    env_file:
      - docker-compose.env
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: ./backend-py
    image: kinetix-api
    restart: unless-stopped
    env_file:
      - ./backend-py/.env
      - docker-compose.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-riseup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-riseup}
      API_PUBLIC_URL: ${PUBLIC_APP_URL:-https://kinetix.infosoftco.com}
      FRONTEND_URL: ${PUBLIC_APP_URL:-https://kinetix.infosoftco.com}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://kinetix.infosoftco.com}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_APP_URL:-https://kinetix.infosoftco.com}
    image: kinetix-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api

  admin:
    build:
      context: ./admin-frontend
      args:
        NEXT_PUBLIC_BASE_PATH: /admin-portal
        NEXT_PUBLIC_API_URL: /api/v1
    image: kinetix-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      NEXT_PUBLIC_BASE_PATH: /admin-portal
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - admin
    networks:
      - default
      - edge

  # Renews the Let's Encrypt cert every 12h (certbot no-ops unless a cert is
  # within its renewal window). Initial issuance is a one-off, run manually
  # via deploy/setup-ssl.sh - this service only handles ongoing renewal.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

networks:
  edge:
    external: true
    name: kinetix_edge

volumes:
  certbot-etc:
  certbot-www:
