# Production app stack — use with:
#   cp docker-compose.env.example docker-compose.env   # set secrets on server only
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# nginx runs on the host (apt), not as a container — see deploy/nginx/host.conf
# and deploy/NGINX_HOST_MIGRATION.md. api/web/admin publish to 127.0.0.1 so
# host nginx can proxy_pass to them directly.
#
# NOTE: this file deliberately declares NO `ports:` entries. Compose APPENDS
# port lists across files rather than replacing them, so re-declaring a port
# here with a different bind address would leave each container with BOTH
# 0.0.0.0:PORT (from the base file) and 127.0.0.1:PORT - the second bind then
# collides with the first and the container dies at creation with
# "address already in use", against a port `ss` reports as completely free.
# The loopback binding is selected by BIND_ADDR=127.0.0.1: instead, set in
# deploy/deploy.sh - see the ports comment in docker-compose.yml.

services:
  postgres:
    env_file:
      - docker-compose.env

  api:
    build: ./backend-py
    image: kinetix-api
    restart: unless-stopped
    env_file:
      - ./backend-py/.env
      - docker-compose.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-riseup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-riseup}
      API_PUBLIC_URL: ${PUBLIC_APP_URL:-https://kinetix.mindrind.com}
      FRONTEND_URL: ${PUBLIC_APP_URL:-https://kinetix.mindrind.com}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://kinetix.mindrind.com}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_APP_URL:-https://kinetix.mindrind.com}
    image: kinetix-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api

  admin:
    build:
      context: ./admin-frontend
      args:
        NEXT_PUBLIC_BASE_PATH: /admin-portal
        NEXT_PUBLIC_API_URL: /api/v1
    image: kinetix-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      NEXT_PUBLIC_BASE_PATH: /admin-portal
    depends_on:
      - api
