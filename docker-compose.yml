services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: docker-compose.env
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riseup}
      POSTGRES_DB: ${POSTGRES_DB:-riseup}
    ports:
      # BIND_ADDR selects the publish interface. Empty (local dev default)
      # publishes on all interfaces; production sets BIND_ADDR=127.0.0.1: so
      # host nginx reaches these over loopback and nothing is exposed
      # publicly. Doing it with a variable rather than a second `ports:` entry
      # in the prod override is deliberate - Compose APPENDS port lists across
      # files instead of replacing them, so an override entry would leave the
      # container with BOTH 0.0.0.0:PORT and 127.0.0.1:PORT and the second
      # bind would collide with the first ("address already in use" against a
      # port that ss shows as free).
      - "${BIND_ADDR:-}${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - riseup_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-riseup} -d $${POSTGRES_DB:-riseup}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend-py
    image: kinetix-api
    restart: unless-stopped
    env_file:
      - path: ./backend-py/.env
        required: false
      - path: docker-compose.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "4000"
      POSTGRES_USER: ${POSTGRES_USER:-riseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riseup}
      POSTGRES_DB: ${POSTGRES_DB:-riseup}
      DATABASE_URL: postgresql://${POSTGRES_USER:-riseup}:${POSTGRES_PASSWORD:-riseup}@postgres:5432/${POSTGRES_DB:-riseup}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-riseup}:${POSTGRES_PASSWORD:-riseup}@postgres:5432/${POSTGRES_DB:-riseup}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-min-32-chars-long-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-min-32-chars-long-key}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:3002}
    ports:
      - "${BIND_ADDR:-}4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    image: kinetix-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    ports:
      - "${BIND_ADDR:-}3000:3000"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./admin-frontend
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_ADMIN_BASE_PATH:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
    image: kinetix-admin
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3002"
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_ADMIN_BASE_PATH:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
    ports:
      - "${BIND_ADDR:-}3002:3002"
    depends_on:
      api:
        condition: service_healthy

volumes:
  riseup_pg_data:

