[package]
name = "kinetix-desktop"
version = "0.1.5"
description = "Kinetix Desktop & Mobile App"
authors = ["Kinetix Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2.6", features = [] }

[dependencies]
# devtools: TEMPORARY, to allow right-click > Inspect in this release build
# while diagnosing the Windows taskbar overlay-icon issue (production builds
# disable this by default). Remove once resolved.
tauri = { version = "^2.11", features = ["image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }


serde_json = "1.0"

# Desktop-only: tauri-plugin-single-instance does not support mobile targets.
# Usage is already gated behind #[cfg(desktop)] in src/lib.rs; the dependency
# itself must be gated the same way or `cargo build` for an Android/iOS
# target fails to resolve/compile it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[lib]
name = "kinetix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
