[package]
name = "kinetix-desktop"
version = "0.1.3"
description = "Kinetix Desktop & Mobile App"
authors = ["Kinetix Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2.6", features = [] }

[dependencies]
tauri = { version = "^2.11", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }


serde_json = "1.0"

# Desktop-only: tauri-plugin-single-instance does not support mobile targets.
# Usage is already gated behind #[cfg(desktop)] in src/lib.rs; the dependency
# itself must be gated the same way or `cargo build` for an Android/iOS
# target fails to resolve/compile it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[lib]
name = "kinetix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
